<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- AI用語ドリルのアイコン：黒地に白の「AI」、下に進捗バーを模したオレンジの線 -->
  <defs>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8623c"/>
      <stop offset="1" stop-color="#f2a03c"/>
    </linearGradient>
    <!-- 文字の上端と下端を水平にそろえるための切り抜き -->
    <clipPath id="letters">
      <rect x="0" y="13" width="64" height="28"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" fill="#131313"/>
  <g fill="none" stroke="#ffffff" stroke-width="5" clip-path="url(#letters)">
    <!-- A -->
    <path d="M15.1 44 L25.5 16 L35.9 44" stroke-linejoin="miter"/>
    <path d="M19.4 33 H31.6"/>
    <!-- I -->
    <path d="M47.5 13 V41"/>
  </g>
  <!-- 進捗バー：残りはグレーの下地 -->
  <rect x="14" y="48" width="36" height="3" fill="#3a3a3a"/>
  <rect x="14" y="48" width="23" height="3" fill="url(#progress)"/>
</svg>
